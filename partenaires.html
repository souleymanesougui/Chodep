<script type="module">
import { escapeHtml } from "./js/main.js";
const FALLBACK = [
  { nom:"Partenaire A", description:"Soutien institutionnel", lien:"#" },
  { nom:"Partenaire B", description:"Appui logistique", lien:"#" },
  { nom:"Partenaire C", description:"Financement de programmes", lien:"#" },
  { nom:"Partenaire D", description:"Partenaire académique", lien:"#" },
];
async function load(){
  let items = FALLBACK;
  try{
    const { supabase } = await import("./js/supabase-config.js");
    const { data, error } = await supabase.from("partenaires").select("*").eq("publie", true);
    if(error) throw error;
    if(data && data.length) items = data;
  }catch(err){ console.warn("Supabase indisponible, partenaires de démonstration.", err.message); }

  document.getElementById("partnersGrid").innerHTML = items.map(p => `
    <a href="${p.lien||'#'}" target="_blank" rel="noopener" class="reveal in" style="text-decoration:none;">
      <div class="partner-logo">${escapeHtml(p.nom)}</div>
      <p class="body-text" style="font-size:0.85rem; text-align:center; margin-top:10px;">${escapeHtml(p.description||"")}</p>
    </a>`).join("");
}
load();
</script>
