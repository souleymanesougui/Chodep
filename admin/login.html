<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion administrateur — CHODEP</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <a href="../index.html" class="brand" style="justify-content:center; margin-bottom:8px;"><span class="mark">CH</span> CHODEP</a>
    <p class="form-note" style="text-align:center; margin-bottom:24px;">Espace administrateur</p>
    <form id="loginForm">
      <div class="field" style="margin-bottom:16px;"><label for="email">Email</label><input type="email" id="email" required autocomplete="username"></div>
      <div class="field" style="margin-bottom:10px;"><label for="password">Mot de passe</label><input type="password" id="password" required autocomplete="current-password"></div>
      <div class="form-error" id="loginError">Identifiants incorrects. Merci de réessayer.</div>
      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:18px;" id="loginBtn">Se connecter</button>
    </form>
    <p class="form-note" style="text-align:center; margin-top:20px;"><a href="../index.html">← Retour au site</a></p>
  </div>
</div>
<script type="module" src="../js/admin-auth.js"></script>
</body>
</html>
